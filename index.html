<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 28C4 19 3 10 9 7c3-1.5 6 0 7 3 1-3 4-4.5 7-3 6 3 5 12-7 21z' fill='%23f2b705' stroke='%233a2410' stroke-width='2' stroke-linejoin='round'/><path d='M9 12c1-2 4-2 5 0M23 12c-1-2-4-2-5 0' fill='none' stroke='%23b07d00' stroke-width='1.6' stroke-linecap='round'/></svg>" />
    <title>Sankofa: Caminhos da Resistência</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1a1a;
        overflow: hidden;
        /* celular: sem zoom de dois toques, sem rolar a página, sem selecionar texto */
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* aviso "gire o celular": só no celular (classe touch, posta pelo jogo) e com a tela em pé */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #1a1a1a;
        color: #f2b705;
        font: bold 20px monospace;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        text-align: center;
        padding: 0 24px;
      }
      #rotate .phone {
        width: 44px;
        height: 76px;
        border: 4px solid #f5e6c8;
        border-radius: 8px;
        animation: turn 2s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 25% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) {
        html.touch #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div><p></p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

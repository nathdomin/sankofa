    <title>Sankofa: Caminhos da Resistência</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1a1a;
        overflow: hidden;
        /* celular: sem zoom de dois toques, sem rolar a página, sem selecionar texto */
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* aviso "gire o celular": só no celular (classe touch, posta pelo jogo) e com a tela em pé */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #1a1a1a;
        color: #f2b705;
        font: bold 20px monospace;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        text-align: center;
        padding: 0 24px;
      }
      #rotate .phone {
        width: 44px;
        height: 76px;
        border: 4px solid #f5e6c8;
        border-radius: 8px;
        animation: turn 2s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 25% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) {
        html.touch #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div><p></p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
